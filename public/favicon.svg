<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 环形金色渐变 -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="yangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="yinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <!-- 外围深曜背景底圆 -->
  <circle cx="64" cy="64" r="62" fill="#07090e" stroke="url(#goldBorder)" stroke-width="3"/>
  <circle cx="64" cy="64" r="58" fill="url(#goldGlow)"/>

  <!-- 太极阳面（白）与底圆 -->
  <circle cx="64" cy="64" r="48" fill="url(#yangGrad)"/>

  <!-- 太极阴面（黑/深靛） -->
  <path d="M 64,16 A 48,48 0 0,1 64,112 A 24,24 0 0,1 64,64 A 24,24 0 0,0 64,16 Z" fill="url(#yinGrad)"/>

  <!-- 阳中之阴鱼眼 -->
  <circle cx="64" cy="40" r="7" fill="url(#yinGrad)"/>

  <!-- 阴中之阳鱼眼 -->
  <circle cx="64" cy="88" r="7" fill="url(#yangGrad)"/>

  <!-- 八卦四象乾坤微点装饰 -->
  <circle cx="64" cy="6" r="2.5" fill="#f59e0b"/>
  <circle cx="64" cy="122" r="2.5" fill="#f59e0b"/>
  <circle cx="6" cy="64" r="2.5" fill="#f59e0b"/>
  <circle cx="122" cy="64" r="2.5" fill="#f59e0b"/>
</svg>
